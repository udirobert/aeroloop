<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>
  body { margin:0; width:1280px; height:512px; background:#0a0e1a; color:#e6edf3;
         font-family: system-ui, sans-serif; display:flex; flex-direction:column;
         justify-content:center; padding:0 90px; position:relative; overflow:hidden; }
  .glow { position:absolute; width:700px; height:700px; border-radius:50%;
          background: radial-gradient(circle, rgba(124,58,237,.28), transparent 65%);
          top:-200px; right:-100px; }
  .ghost { font-size:64px; filter: drop-shadow(0 0 24px rgba(168,85,247,.9)); }
  h1 { font-size:74px; margin:14px 0 8px; letter-spacing:.01em; }
  .sub { font-size:26px; color:#9aa3b8; max-width:900px; line-height:1.35; }
  .sub em { color:#a78bfa; font-style:normal; }
  .stats { margin-top:34px; display:flex; gap:44px; font-size:20px; color:#8b93a7; }
  .stats b { color:#e6edf3; }
  .tag { position:absolute; top:28px; right:40px; font-size:13px; color:#c4b5fd;
         border:1px solid #4c3a78; border-radius:999px; padding:5px 13px; }
</style></head>
<body>
  <div class="glow"></div>
  <div><span class="ghost">👻</span></div>
  <h1>AeroLoop</h1>
  <div class="sub">The air-quality agent that <em>remembers every mistake</em> — predicts, scores itself, rewrites its own strategy, and keeps the rejects as ghosts.</div>
  <div class="stats">
    <span><b>holdout MAE 3.94 → 2.99</b> (−24%)</span>
    <span>open-weight: <b>Gemma · TabPFN · Ollama</b></span>
    <span>local-first</span>
  </div>
</body>
</html>
