<html lang="en">
<body>
<template>
<div id="root" data-composition-id="s00-ghost" data-duration="20" data-fps="30">
  <style>
    #root {
      position: absolute; inset: 0; overflow: hidden;
      background: #0e1216; color: #e6ede8;
      font-family: "JetBrains Mono", monospace;
    }
    #film { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.8; }
    #cv { position: absolute; inset: 0; }
    #veil {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, rgba(14,18,22,0) 45%, rgba(14,18,22,0.75) 100%);
    }
    .card {
      position: absolute; left: 0; right: 0; text-align: center;
      font-size: 34px; letter-spacing: 0.05em; color: #e6ede8; opacity: 0;
      text-shadow: 0 2px 24px #000;
    }
    .card.dim { color: #8d83b8; font-size: 30px; }
    .card.acc { color: #57e6c9; }
    #c1 { top: 240px; } #c2 { top: 320px; }
    #c3 { top: 240px; } #c4 { top: 320px; }
    #c5 { top: 280px; }
  </style>

  <div class="clip" id="s00-stage">
    <video id="film" src="assets/ghost-open.mp4" muted playsinline data-start="0" data-duration="20" class="clip"></video>
    <canvas id="cv" width="1920" height="1080" data-layout-ignore></canvas>
    <div id="veil"></div>
    <div class="card dim" id="c1">LONDON · DECEMBER 1952</div>
    <div class="card" id="c2">the Great Smog killed ~12,000 people in five days</div>
    <div class="card dim" id="c3">the particles never really left</div>
    <div class="card acc" id="c4">~4 million deaths a year — in air you cannot see</div>
    <div class="card" id="c5">four monitors still try to watch a whole city</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    // — spectral haze kit (shared) + ghost glyph —
    function M(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
    var CV=document.getElementById("cv"),CX=CV.getContext("2d"),W=CV.width,H=CV.height;
    function haze(n,seed){var R=M(seed),P=[];for(var i=0;i<n;i++)P.push({x:R()*W,y:R()*H,vx:(R()-.5)*16,vy:(R()-.5)*9,r:.6+R()*2.4,a:.05+R()*.16});return function(t){for(var i=0;i<n;i++){var p=P[i],x=(p.x+p.vx*t)%W,y=(p.y+p.vy*t)%H;if(x<0)x+=W;if(y<0)y+=H;var tw=.5+.5*Math.sin(t*.7+i*1.7);CX.globalAlpha=p.a*tw;CX.fillStyle="#b455f0";CX.beginPath();CX.arc(x,y,p.r,0,7);CX.fill()}}}
    function fog(seed){var R=M(seed),B=[];for(var i=0;i<6;i++)B.push({x:R()*W,y:H*(.1+R()*.8),r:H*(.35+R()*.5),vx:(R()-.5)*34,a:.07+R()*.07});return function(t){for(var i=0;i<B.length;i++){var b=B[i],x=b.x+b.vx*t;if(x<-b.r)x+=W+2*b.r;if(x>W+b.r)x-=W+2*b.r;var g=CX.createRadialGradient(x,b.y,0,x,b.y,b.r);g.addColorStop(0,"rgba(110,105,190,"+b.a+")");g.addColorStop(1,"rgba(110,105,190,0)");CX.fillStyle=g;CX.fillRect(x-b.r,b.y-b.r,2*b.r,2*b.r)}}}
    function ghost(x,y,s,a){CX.globalAlpha=a;CX.fillStyle="#e9d5ff";CX.beginPath();CX.arc(x,y,s,Math.PI,0);CX.lineTo(x+s,y+s*1.1);for(var i=0;i<4;i++)CX.quadraticCurveTo(x+s-(i*2+1)*s/4,y+s*(1.1+(i%2?0.22:0.02)),x+s-(i*2+2)*s/4,y+s*1.1);CX.closePath();CX.fill();CX.fillStyle="#0e1216";CX.beginPath();CX.arc(x-s*.35,y-s*.1,s*.13,0,7);CX.arc(x+s*.35,y-s*.1,s*.13,0,7);CX.fill();CX.globalAlpha=1}
    // the wisp-ghost rises through the fog and drifts off right
    function spirit(t){
      if(t<12.5||t>19.6)return;
      var p=(t-12.5)/7.1;
      var x=560+p*620+Math.sin(t*0.9)*24, y=980-p*520;
      var a=Math.min(1,(t-12.5)/1.2)*Math.max(0,Math.min(1,(19.6-t)/1.5))*0.85;
      ghost(x,y,30+6*Math.sin(t*1.3),a);
      for(var k=1;k<7;k++){var ty=y+k*16+Math.sin(t*1.1+k)*8;
        CX.globalAlpha=a*0.3*(1-k/8);CX.fillStyle="#b455f0";
        CX.beginPath();CX.arc(x-6+Math.sin(k*2)*8,ty,5-k*0.5,0,7);CX.fill();}
      CX.globalAlpha=1;
    }
    var FOG=fog(13),HAZE=haze(420,29);

    var tl = gsap.timeline({ paused: true,
      onUpdate:function(){var t=tl.time();CX.clearRect(0,0,W,H);CX.globalAlpha=1;
        FOG(t);HAZE(t);spirit(t);}});

    [["c1",0.8],["c2",5.2],["c3",9.8],["c4",11.8],["c5",15.8]].forEach(function(c,i){
      var id=c[0],at=c[1];
      tl.fromTo("#"+id,{opacity:0,y:16},{opacity:1,y:0,duration:0.5,ease:"power3.out"},at);
      var outs=[4.6,9.5,11.6,15.4,0];if(i<4)tl.to("#"+id,{opacity:0,duration:0.4},outs[i]);
    });
    tl.seek(0);
    window.__timelines = window.__timelines || {};
    window.__timelines["s00-ghost"] = tl;
  </script>
</div>
</template>
</body>
</html>
