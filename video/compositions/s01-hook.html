<html lang="en">
<body>
<template>

  <style>

  <div class="clip" id="s01-stage" data-start="0" data-duration="10.2">
    <canvas id="cv" width="1920" height="1080" data-layout-ignore></canvas>
    <div class="tag" data-layout-ignore><b>score</b> · trueforge eval · ground-monitor PM2.5</div>
    <div id="kicker">LONDON · DECEMBER 1952</div>
    <div id="lab-old" data-layout-allow-overlap>run 04 · evals/tasks · 8 tasks</div>
    <div id="lab-new" data-layout-allow-overlap>run 11 · evals/hard · unseen</div>
    <div id="big">87.03</div>
    <div id="redbar"></div>
    <div id="ticks">
      <div class="tk"></div><div class="tk"></div><div class="tk"></div>
      <div class="tk"></div><div class="tk"></div><div class="tk"></div>
      <div class="tk"></div><div class="tk"></div><div class="tk"></div>
      <div class="tk"></div><div class="tk t11"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    // — spectral haze kit: seeded, deterministic, canvas-painted —
    function M(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
    var CV=document.getElementById("cv"),CX=CV.getContext("2d"),W=CV.width,H=CV.height;
    function haze(n,seed){var R=M(seed),P=[];for(var i=0;i<n;i++)P.push({x:R()*W,y:R()*H,vx:(R()-.5)*12,vy:(R()-.5)*7,r:.6+R()*2,a:.05+R()*.15});return function(t){for(var i=0;i<n;i++){var p=P[i],x=(p.x+p.vx*t)%W,y=(p.y+p.vy*t)%H;if(x<0)x+=W;if(y<0)y+=H;var tw=.5+.5*Math.sin(t*.7+i*1.7);CX.globalAlpha=p.a*tw;CX.fillStyle="#57e6c9";CX.beginPath();CX.arc(x,y,p.r,0,7);CX.fill()}}}
    function fog(seed){var R=M(seed),B=[];for(var i=0;i<4;i++)B.push({x:R()*W,y:H*(.12+R()*.76),r:H*(.3+R()*.45),vx:(R()-.5)*26,a:.05+R()*.06});return function(t){for(var i=0;i<B.length;i++){var b=B[i],x=b.x+b.vx*t;if(x<-b.r)x+=W+2*b.r;if(x>W+b.r)x-=W+2*b.r;var g=CX.createRadialGradient(x,b.y,0,x,b.y,b.r);g.addColorStop(0,"rgba(110,105,190,"+b.a+")");g.addColorStop(1,"rgba(110,105,190,0)");CX.fillStyle=g;CX.fillRect(x-b.r,b.y-b.r,2*b.r,2*b.r)}}}
    // puff: sample text pixels -> particles converge ("in") or scatter ("out")
    function puff(o){var R=M(o.seed||7),off=document.createElement("canvas");off.width=W;off.height=H;var oc=off.getContext("2d");oc.font=o.font;oc.textAlign="center";oc.textBaseline="middle";oc.fillStyle="#fff";oc.fillText(o.text,o.cx,o.cy);var D=oc.getImageData(0,0,W,H).data,st=Math.max(2,Math.round(Math.min(W,H)/240)),C=[];for(var y=0;y<H;y+=st)for(var x=0;x<W;x+=st)if(D[(y*W+x)*4+3]>127)C.push([x,y]);var P=[],keep=C.length>(o.count||2600)?(o.count||2600)/C.length:1;for(var i=0;i<C.length;i++)if(R()<keep){var a=R()*6.283;P.push({tx:C[i][0],ty:C[i][1],ox:Math.cos(a),oy:Math.sin(a),d:(0.12+0.5*R())*Math.min(W,H),at:.15+.6*R(),tr:.2+.15*R(),fd:.06+.05*R(),r:(.5+1.5*R())*(st/3),dim:.5+.5*R()})}return function(p){for(var i=0;i<P.length;i++){var q=P[i],u,di,al;if(o.dir==="in"){var b=Math.max(0,q.at-q.tr);u=(p-b)/(q.at-b);u=u<0?0:u>1?1:u;if(u<=0)continue;var s=(p-q.at)/q.fd;s=s<0?0:s>1?1:s;al=(u/.14>1?1:u/.14)*(1-s)*q.dim;var e=1-Math.pow(1-u,3);di=q.d*(1-e)}else{u=(p-q.at)/q.tr;u=u<0?0:u>1?1:u;if(u<=0)continue;al=(u/.12>1?1:u/.12)*(1-u)*q.dim;di=q.d*u*u}if(al<=.004)continue;CX.globalAlpha=al;CX.fillStyle=o.col;CX.beginPath();CX.arc(q.tx+q.ox*di,q.ty+q.oy*di,q.r,0,7);CX.fill()}}}

    var root = document.getElementById("root");
    var big = root.querySelector("#big");
    var tl = gsap.timeline({ paused: true,
      onUpdate:function(){
        var t=tl.time();CX.clearRect(0,0,W,H);CX.globalAlpha=1;
        FOG(t);HAZE(t);
        if(t>0.35&&t<2.35)IN87((t-0.35)/2.0);
        if(t>7.0&&t<8.7)OUT87((t-7.0)/1.7);
        if(t>8.75&&t<9.5)OUT55((t-8.75)/0.75);
      }});
    var FOG=fog(3),HAZE=haze(340,11);
    var IN87=puff({text:"87.03",font:"900 300px Inter",cx:960,cy:540,dir:"in",col:"#57e6c9",seed:21,count:2600});
    var OUT87=puff({text:"87.03",font:"900 300px Inter",cx:960,cy:540,dir:"out",col:"#57e6c9",seed:21,count:2600});
    var OUT55=puff({text:"55.10",font:"900 300px Inter",cx:960,cy:540,dir:"out",col:"#ff5b4d",seed:31,count:1800});

    // cold open: London has seen this ghost before
    tl.fromTo("#kicker",{opacity:0},{opacity:1,duration:0.5},0.15);
    tl.to("#kicker",{opacity:0,duration:0.4},1.8);
    // the score assembles out of the haze; crisp DOM digits hold after
    tl.fromTo(big,{opacity:0},{opacity:1,duration:0.45},1.9);
    tl.set("#lab-old",{opacity:1},0);
    tl.fromTo("#ticks",{opacity:0},{opacity:1,duration:0.3},2.6);
    tl.to(".tk",{opacity:1,duration:0.16,stagger:0.26,ease:"power2.out"},2.9);
    tl.set(".t11",{opacity:0},0);

    // the drop: digits roll 87.03 -> 55.10 while the haze sheds them
    var START=7.0,DUR=1.5,FPS=30,N=Math.round(DUR*FPS);
    var ease=gsap.parseEase("sine.inOut");
    for(var f=0;f<=N;f++){
      var v=87.03+(55.10-87.03)*ease(f/N);
      tl.set(big,{textContent:v.toFixed(2)},START+f/FPS);
    }
    tl.to(big,{color:"#ff5b4d",duration:1.0,ease:"power2.inOut"},START+0.3);
    tl.to("#lab-old",{opacity:0,duration:0.25},START+1.0);
    tl.fromTo("#lab-new",{opacity:0,y:10},{opacity:1,y:0,duration:0.35,ease:"power3.out"},START+0.8);
    tl.set(".t11",{opacity:1},START+1.3);
    tl.to(".tk:not(.t11)",{opacity:0.35,duration:0.3},START+1.3);
    tl.fromTo("#redbar",{opacity:0,scaleX:0},{opacity:1,scaleX:1,duration:0.28,ease:"power4.in"},8.9);

    tl.seek(0);
    window.__timelines = window.__timelines || {};
    window.__timelines["s01-hook"] = tl;
  </script>
