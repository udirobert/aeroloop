<html lang="en">
<body>
<template>
<div id="root" data-composition-id="s01-hook" data-duration="10.2" data-fps="30">
  <style>
    #root {
      position: absolute; inset: 0; overflow: hidden;
      background: transparent; color: #e6ede8;
      font-family: "JetBrains Mono", monospace;
    }
    .tag {
      position: absolute; top: 84px; left: 96px;
      font-size: 24px; color: #7d8f8a; letter-spacing: 0.08em;
    }
    .tag b { color: #e6ede8; font-weight: 700; }
    #lab-old, #lab-new {
      position: absolute; top: 330px; left: 0; right: 0;
      text-align: center; font-size: 30px; letter-spacing: 0.06em;
    }
    #lab-old { color: #7d8f8a; }
    #lab-new { color: #ff5b4d; opacity: 0; }
    #big {
      position: absolute; top: 390px; left: 0; right: 0;
      text-align: center;
      font-family: "Inter", sans-serif; font-weight: 900;
      font-size: 300px; letter-spacing: -0.04em; line-height: 1;
      color: #57e6c9; font-variant-numeric: tabular-nums;
    }
    #ticks {
      position: absolute; top: 800px; left: 0; right: 0;
      display: flex; justify-content: center; gap: 18px;
    }
    .tk {
      width: 34px; height: 14px; background: #57e6c9; opacity: 0;
    }
    .tk.t11 { background: #ff5b4d; }
    #redbar {
      position: absolute; top: 762px; left: 50%; width: 620px; height: 8px;
      margin-left: -310px; background: #ff5b4d; opacity: 0;
    }
  </style>

  <div class="clip" id="s01-stage" data-start="0" data-duration="10.2">
    <div class="tag" data-layout-ignore><b>score</b> · trueforge eval · ground-monitor PM2.5</div>
    <div id="lab-old" data-layout-allow-overlap>run 04 · evals/tasks · 8 tasks</div>
    <div id="lab-new" data-layout-allow-overlap>run 11 · evals/hard · unseen</div>
    <div id="big">87.03</div>
    <div id="redbar"></div>
    <div id="ticks">
      <div class="tk"></div><div class="tk"></div><div class="tk"></div>
      <div class="tk"></div><div class="tk"></div><div class="tk"></div>
      <div class="tk"></div><div class="tk"></div><div class="tk"></div>
      <div class="tk"></div><div class="tk t11"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    var root = document.getElementById("root");
    var big = root.querySelector("#big");
    var ticks = root.querySelectorAll(".tk");
    var tl = gsap.timeline({ paused: true });

    tl.set("#lab-old", {opacity:1}, 0);
    tl.set(big, {opacity:1}, 0);
    tl.fromTo("#ticks", {opacity:0},{opacity:1,duration:0.3}, 1.7);
    tl.to(".tk", {opacity:1, duration:0.16, stagger:0.26, ease:"power2.out"}, 2.0);
    // the 11th (red) tick stays hidden until the drop
    tl.set(".t11", {opacity:0}, 0);

    // the drop: digits roll 87.03 -> 55.10, colour to red
    var START = 7.0, DUR = 1.5, FPS = 30, N = Math.round(DUR*FPS);
    var ease = gsap.parseEase("sine.inOut");
    for (var f = 0; f <= N; f++) {
      var v = 87.03 + (55.10 - 87.03) * ease(f / N);
      tl.set(big, {textContent: v.toFixed(2)}, START + f/FPS);
    }
    tl.to(big, {color:"#ff5b4d", duration:1.0, ease:"power2.inOut"}, START + 0.3);
    tl.to("#lab-old", {opacity:0, duration:0.25}, START + 1.0);
    tl.fromTo("#lab-new", {opacity:0,y:10},{opacity:1,y:0,duration:0.35,ease:"power3.out"}, START + 0.8);
    tl.set(".t11", {opacity:1}, START + 1.3);
    tl.to(".tk:not(.t11)", {opacity:0.35, duration:0.3}, START + 1.3);
    tl.fromTo("#redbar", {opacity:0,scaleX:0},{opacity:1,scaleX:1,duration:0.28,ease:"power4.in"}, 8.9);

    tl.seek(0);
    window.__timelines = window.__timelines || {};
    window.__timelines["s01-hook"] = tl;
  </script>
</div>
</template>
</body>
</html>
